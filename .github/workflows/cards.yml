name: Update cards
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: imwill08
        run: python scripts/generate_cards.py --user "$GH_USER"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/heatmap.svg cards/activity.svg
          git diff --cached --quiet || git commit -m "chore: refresh cards"
          git push
